[package]
name = "fers"
version = "0.1.0"
edition = "2024"

[dependencies]
pc-keyboard = "0.7.0"
pic8259 = "0.11.0"
spin = "0.12.3"
volatile = "0.6.1"
x86_64 = "0.15.5"
bootloader = { version = "0.9", features = ["map_physical_memory"] }
linked_list_allocator = "0.9.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
